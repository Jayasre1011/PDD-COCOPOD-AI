name: CocoaPodAI CI & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax and Imports
        run: |
          python -m py_compile Home.py
          python -m py_compile pages/1_🔬_Predict.py
          python -m py_compile pages/2_📖_Pod_Guide.py
          python -m py_compile src/theme.py
          python -m py_compile src/feature_extraction.py
          python -m py_compile src/segmentation.py

      - name: Verify Model Integrity
        run: |
          python -c "import joblib; model = joblib.load('models/svm_single.pkl'); print('svm_single model loaded successfully:', model)"
          python -c "import joblib; model = joblib.load('models/svm_full.pkl'); print('svm_full model loaded successfully:', model)"
